name: Predict + Stock Pick

on:
  schedule:
    - cron: '30 12 * * 1-5'   # 12:30 UTC = 8:30 AM ET
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # needed to workflow_dispatch deploy.yml (GITHUB_TOKEN pushes don't fire other workflows)

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run predictions (AI-powered)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pip install requests -q
          python3 predictions/predict.py

      - name: Commit predictions immediately
        run: |
          git config user.name "PaperChase Bot"
          git config user.email "bot@paperchase.online"
          git add predictions/data/predictions.json
          if git diff --cached --quiet; then
            echo "No prediction changes to commit"
          else
            git commit -m "pred: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase origin main
            git push
          fi

      - name: Run Stock Pick screener (yfinance + AI analysis)
        if: success() || failure()
        timeout-minutes: 10
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pip install yfinance requests -q
          python3 stock-pick/screener.py 2>&1 | tail -5

      - name: Commit stock picks
        if: success() || failure()
        run: |
          git config user.name "PaperChase Bot"
          git config user.email "bot@paperchase.online"
          git add stock-pick/data/picks.json
          if git diff --cached --quiet; then
            echo "No stock pick changes to commit"
          else
            git commit -m "picks: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase origin main
            git push
          fi

      - name: Trigger deploy (GITHUB_TOKEN pushes don't fire other workflows)
        if: always()
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/PaperChaseAdmin/paperchaseadmin.github.io/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
