name: Update Market Data

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:           # manual trigger

concurrency:
  group: update-data
  cancel-in-progress: false    # queue instead of racing (was: parallel runs → git push race)

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ms.txt

      - name: Install dependencies
        run: pip install -r requirements-ms.txt

      - name: Update market data
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python update_data.py

      - name: Commit & push updated data
        run: |
          git config user.name  "market-sentinel[bot]"
          git config user.email "market-sentinel[bot]@users.noreply.github.com"
          git pull --rebase origin main   # avoid non-fast-forward race with other runs
          git add data/market_data.json
          git diff --staged --quiet || git commit -m "data: update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Trigger deploy (GITHUB_TOKEN pushes don't fire other workflows)
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/PaperChaseAdmin/paperchaseadmin.github.io/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
